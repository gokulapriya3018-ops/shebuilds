<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website</title>
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="css/bootstrap.min.css">
</head>

<body>
  <div class="container my-4">
    <h1 class="mb-4">My Website</h1>

    <!-- Row 1: Primary (Blue) -->
    <div class="row mb-3">
      <div class="col bg-primary text-white p-4 rounded">
        <h3>Row 1</h3>
      </div>
    </div>

    <!-- Row 2: Success (Green) -->
    <div class="row mb-3">
      <div class="col bg-success text-white p-4 rounded">
        <h3>Row 2</h3>
      </div>
    </div>

    <!-- Row 3: Warning (Yellow) -->
    <div class="row">
      <div class="col bg-warning text-dark p-4 rounded">
        <h3>Row 3</h3>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="js/bootstrap.bundle.min.js"></script>
</body>

</html>
